    <header>

        <h2>Thanks for ordering</h2>
        <h2>Open the terminal console to recieve your cozy cup!</h2>
    </main>

    <script>
        // My program runs a tiny Cafe sim in which 

        var coffeeRoast = prompt('Welcome to DeCaf Critter Cafe!\n—— No jitters, just critters!\n\nWhat kind of roast would you like for your coffee?', '').toLowerCase(); 

        if(coffeeRoast === 'dark'){
            console.log(`...and brooding? I got you ;)\n\nHere's your decaf ${coffeeRoast} roast, have a lovely day!`);
            
            } else if(coffeeRoast === 'medium'){
            console.log(`A classic! Nice choice ;)\n\nHere's your decaf ${coffeeRoast} roast, have a lovely day!`);
            
            } else if(coffeeRoast === 'light'){
            console.log(`Well, aren't you bubbly! I like you ;)\n\nHere's your decaf ${coffeeRoast} roast, have a lovely day!`);
        
            } else {
            console.log(`Well, I asked our barista and it looks like we don't have that roast at the moment...\n\nCast the *cmd+R* incancation to try something new!`);
        }

</script>
