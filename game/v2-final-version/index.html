<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCast</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Title Page -->

    <header id="title-page">
        <h1><img src="images/title.png" alt="StarCast" width="651" height="131"></h1>
        <p id="start-game"><img src="images/skygaze-btn.png" alt="Start" width="336" height="71"></p>
    </header>


    <!-- GAME -->
    
    <header id="game-header">
        <h1><img src="images/title.png" alt="StarCast"></h1>
        <p id="time-to-cast"><img src="images/overlay-title.png" alt="Time to Cast" width="386" height="162"></p>
    </header>


    <!-- Casting Overlay -->

    <section id="cast-overlay">
        <header>
            <figure id="sun-icon"><img src="images/avatar-icon-sun.png" alt="Sun character icon"></figure>
            <h1 id="overlay-title"><img src="images/overlay-title.png" alt="Time to Cast"></h1>
            <figure id="moon-icon"><img src="images/avatar-icon-moon.png" alt="Moon character icon"></figure>
        </header>

        <section>
            <figure id="cast-cloud"><img src="images/guess-common-cloud.png" alt="Cloud"></figure>
            <div id="cast-star"><img src="images/guess-rare-star.png" alt="Shooting star"></div>
            <div id="cast-clear"><img src="images/guess-common-clear.png" alt="Clear"></div>
        </section>

        <div id="skygaze-btn"><img src="images/skygaze-btn.png" alt="Skygaze" width="224" height="47"></div>
    </section>


    <!-- Main -->

    <main>
        <section id="score">
            <div id="left-points">
                 <!-- <p id="left-0p"><img src="images/player-score-zero.png" alt="1 point"></p> -->
                <p id="left-1p"><img src="images/player-score-one.png" alt="1 point"></p>
                <p id="left-2p"><img src="images/player-score-two.png" alt="2 point"></p>
                <p id="left-3p"><img src="images/player-score-three.png" alt="3 point"></p>
                <p id="left-4p"><img src="images/player-score-four.png" alt="4 point"></p>
                <p id="left-5p"><img src="images/player-score-five.png" alt="5 point"></p>
            </div>

            <div id="right-points">
                <!-- <p id="right-0p"><img src="images/player-score-zero.png" alt="1 point"></p> -->
                <p id="right-1p"><img src="images/player-score-one.png" alt="1 point"></p>
                <p id="right-2p"><img src="images/player-score-two.png" alt="2 point"></p>
                <p id="right-3p"><img src="images/player-score-three.png" alt="3 point"></p>
                <p id="right-4p"><img src="images/player-score-four.png" alt="4 point"></p>
                <p id="right-5p"><img src="images/player-score-five.png" alt="5 point"></p>
            </div>
        </section>
        
        <section id="avatars-and-weather">
            <section id="p1-avatar-section">
                <figure id="avatar-sun"><img src="images/avatar-sun.png" alt="Sun avatar"></figure>
                <figure id="p1-avatar-cloud"><img src="images/chosen-cloud.png" alt="Cloud"></figure>
                <figure id="p1-avatar-clear"><img src="images/chosen-clear.png" alt="Cloud"></figure>
                <figure id="p1-avatar-star"><img src="images/chosen-star.png" alt="Cloud"></figure>
            </section>

            <section id="weather-section">
                <figure id="weather-cloud"><img src="images/sky-cloud.png" alt="Cloudy sky"></figure>
                <figure id="weather-clear"><img src="images/sky-clear.png" alt="Clear skies"></figure>
                <figure id="weather-star"><img src="images/sky-star.png" alt="Shooting stars"></figure>
            </section>

            <section id="p2-avatar-section">
                <figure id="avatar-moon"><img src="images/avatar-moon.png" alt="Sun avatar"></figure>
                <figure id="p2-avatar-cloud"><img src="images/chosen-cloud.png" alt="Cloud"></figure>
                <figure id="p2-avatar-clear"><img src="images/chosen-clear.png" alt="Cloud"></figure>
                <figure id="p2-avatar-star"><img src="images/chosen-star.png" alt="Cloud"></figure>
            </section>
        </section>

        <!-- Results -->

        <section id="round-results">
            <p id="rr-sun" class="round-result"><img src="images/round-result-sun.png" alt="Winner is Sun"></p>
            <p id="rr-moon" class="round-result"><img src="images/round-result-moon.png" alt="Winner is Moon"></p>
            <p id="rr-draw" class="round-result"><img src="images/round-result-draw.png" alt="Draw"></p>
        </section>

        <section id="game-results">
            <p id="gr-sun" class="round-result"><img src="images/round-result-sun.png" alt="Winner is Sun" width="878" height="326"></p>
            <p id="gr-moon" class="round-result"><img src="images/round-result-moon.png" alt="Winner is Moon" width="878" height="326"></p>
            <p id="gr-draw" class="round-result"><img src="images/round-result-draw.png" alt="Draw" width="878" height="326"></p>
        </section>

    </main>

</body>
</html>
