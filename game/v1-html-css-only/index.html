<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCast V1</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="backdrop">
        <header>
            <div id="util-help"><img src="images/util-help.png" alt=""></div>
            <div id="title"><img src="images/title.png" alt=""></div>
            <div id="util-settings"><img src="images/util-settings.png" alt=""></div>
        </header>


        <!-- Casting Overlay -->

        <div id="casting-overlay">
            <div id="overlay-title"><img src="images/overlay-title.png" alt=""></div>

            <div id="avatar-icon-sun"><img src="images/avatar-icon-sun.png" alt=""></div>
            <div id="avatar-icon-moon"><img src="images/avatar-icon-moon.png" alt=""></div>

            <div id="guess-common-cloud"><img src="images/guess-common-cloud.png" alt=""></div>
            <div id="guess-rare-star"><img src="images/guess-rare-star.png" alt=""></div>
            <div id="guess-common-clear"><img src="images/guess-common-clear.png" alt=""></div>
            
            <div id="skygaze-btn"><img src="images/skygaze-btn.png" alt=""></div>
        </div>
        


        

        <!-- Player Sections -->

        <div id="player-sections">
            <div id="left-player-section">
                <div id="left-plus-point"><img src="images/plus-point.png" alt=""></div>
                
                <!-- <div id="left-score-one" class="left-player-score"><img src="images/player-score-one.png" alt=""></div> -->
                <div id="left-score-two" class="left-player-score"><img src="images/player-score-two.png" alt=""></div>
                <!-- <div id="left-score-three" class="left-player-score"><img src="images/player-score-three.png" alt=""></div> -->
                <!-- <div id="left-score-four" class="left-player-score"><img src="images/player-score-four.png" alt=""></div> -->
                <!-- <div id="left-score-five" class="left-player-score"><img src="images/player-score-five.png" alt=""></div> -->

                <div id="avatar-sun"><img src="images/avatar-sun.png" alt=""></div>
                
                <div id="left-chosen-cloud" class="left-chosen-weather"><img src="images/chosen-cloud.png" alt=""></div>
                <!-- <div id="left-chosen-clear" class="left-chosen-weather"><img src="images/chosen-clear.png" alt=""></div> -->
                <!-- <div id="left-chosen-star" class="left-chosen-weather"><img src="images/chosen-star.png" alt=""></div> -->
            </div>

            <div id="right-player-section">
                <div id="right-score-one" class="right-player-score"><img src="images/player-score-one.png" alt=""></div>
                <!-- <div id="right-score-two" class="right-player-score"><img src="images/player-score-two.png" alt=""></div> -->
                <!-- <div id="right-score-three" class="right-player-score"><img src="images/player-score-three.png" alt=""></div> -->
                <!-- <div id="right-score-four" class="right-player-score"><img src="images/player-score-four.png" alt=""></div> -->
                <!-- <div id="right-score-five" class="right-player-score"><img src="images/player-score-five.png" alt=""></div> -->

                <div id="avatar-moon"><img src="images/avatar-moon.png" alt=""></div>
                
                <!-- <div id="right-chosen-cloud" class="right-chosen-weather"><img src="images/chosen-cloud.png" alt=""></div> -->
                <div id="right-chosen-clear" class="right-chosen-weather"><img src="images/chosen-clear.png" alt=""></div>
                <!-- <div id="right-chosen-star" class="right-chosen-weather"><img src="images/chosen-star.png" alt=""></div> -->

                <!-- <div id="right-plus-point"><img src="images/plus-point.png" alt=""></div> -->
            </div>
        </div>


        <!-- Results -->

        <div id="sky-cloud" class="sky"><img src="images/sky-cloud.png" alt=""></div>
        <!-- <div id="sky-clear" class="sky"><img src="images/sky-clear.png" alt=""></div> -->
        <!-- <div id="sky-star" class="sky"><img src="images/sky-star.png" alt=""></div> -->

        <div id="round-result-sun" class="round-result"><img src="images/round-result-sun.png" alt=""></div>
        <!-- <div id="round-result-moon" class="round-result"><img src="images/round-result-moon.png" alt=""></div> -->
        <!-- <div id="round-result-draw" class="round-result"><img src="images/round-result-draw.png" alt=""></div> -->
    </div>
</body>
</html>
