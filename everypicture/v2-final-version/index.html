<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Picture Experiment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="fake-body">
        <h1>Sabi's Arcade</h1>
        
        <p id="onboarding">Use the arrow keys to explore a few of my indie games!</p>

        <div id="screen">
            <img id="pointer" src="images/pointer.png" alt="Pointer">
        </div>

        <main>
            <section id="img1" class="hidden">
                <img src="images/pop-fast.png" alt="Pixel art bubbles">
                <h2><a href="https://unkani-grani.itch.io/in-a-pinch"><em>In a Pinch!</em></a></h2>
                <p>A bubble wand tells you to pop its own bubbles, and fast...</p>
            </section>

            <section id="img2" class="hidden">
                <img src="images/scorpus.png" alt="Scorpus constellation">
                <h2><a href="https://unkani-grani.itch.io/starrunner"><em>Starrunner</em></a></h2>
                <p>Running through stars, chasing a dream...</p>
            </section>

            <section id="img3" class="hidden">
                <img src="images/tree.png" alt="Pixel art tree">
                <h2><a href="https://unkani-grani.itch.io/dot-spot"><em>Dot Spot</em></a></h2>
                <p>Fixing the asymmetry, finding the right place...</p>
            </section>
        </main>
    </div>
</body>
</html>
