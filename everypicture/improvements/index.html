<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
    
    <title>Every Picture</title>
</head>

<body>
    <main>
        <header>
            <h1>Sabi's Arcade</h1>
            <p id="onboarding">Use arrow keys to find the hidden games!</p>
        </header>

        <div id="left" class="bkgd"></div>

        <div id="center" class="bkgd">
            <!-- <div id="screen"> -->
                <div id="pointer"></div>
                
                <div id="hit1">
                    <img src="images/pop-fast.png" alt="Pixel art bubbles" width="200" height="200">
                    <div>
                        <h2><a href="https://unkani-grani.itch.io/in-a-pinch"><em>In a Pinch!</em></a></h2>
                        <p>A bubble wand tells you to pop its own bubbles, and fast...</p>
                    </div>
                </div>

                <div id="hit2">
                    <img src="images/scorpus.png" alt="Scorpus constellation" width="200" height="200">
                    <div>
                        <h2><a href="https://unkani-grani.itch.io/starrunner"><em>Starrunner</em></a></h2>
                        <p>Running through stars, chasing a dream...</p>
                    </div>
                </div>

                <div id="hit3">
                    <img src="images/tree.png" alt="Pixel art tree" width="200" height="200">
                    <div>
                        <h2><a href="https://unkani-grani.itch.io/dot-spot"><em>Dot Spot</em></a></h2>
                        <p>Fixing the asymmetry, finding the right place...</p>
                    </div>
                </div>
            <!-- </div> -->
        </div>
        <div id="right" class="bkgd"></div>
    </main>
</body>
</html>
